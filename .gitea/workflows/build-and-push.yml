name: Build e Push para Registry

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [service-updated]

jobs:
  build-and-push:
    runs-on: [self-hosted, ubuntu-latest]

    env:
      REGISTRY: docker.easydoor.ai/easydoor

    steps:

      # 1️⃣ Checkout infra
      - name: Checkout ed-infra
        uses: actions/checkout@v4
        with:
          path: ed-infra

      # 2️⃣ Calcular versão da infra
      - name: Calcular APP_VERSION
        id: version
        working-directory: ed-infra
        run: echo "APP_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 3️⃣ Clonar repositórios irmãos
      - name: Clonar repos irmãos
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          BASE_URL="https://deploy:${TOKEN}@git.easydoor.ai/EasyDoor"
          cd $GITHUB_WORKSPACE
          for repo in ed-backend-api ed-worker ed-raspadinha ed-geocoder ed-watchdog ed-frontend-app ed-admin ed-calibrador ed-engine; do
            git clone "${BASE_URL}/${repo}.git" "${repo}" || true
          done

      # 4️⃣ Login no registry
      - name: Login no Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.easydoor.ai
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 5️⃣ Build apenas se tag não existir
      # IMPORTANTE: todos os serviços usam o hash do ed-infra (APP_VERSION) como
      # versão — não o hash do próprio repo. O servidor (ed-backend-api) grava
      # SERVER_VERSION=$APP_VERSION e rejeita workers com WORKER_VERSION diferente.
      # Usar hashes distintos por repo quebra essa invariante e causa o erro:
      # "[WARN] Worker desatualizado. Versão local: X, Servidor: Y"
      # Ver issue #23.
      - name: Build das imagens
        working-directory: ed-infra
        run: |
          APP_VERSION=${{ steps.version.outputs.APP_VERSION }}
          for svc in ed-backend-api ed-worker ed-geocoder ed-watchdog ed-frontend-app ed-admin ed-calibrador; do
            IMAGE=${REGISTRY}/${svc}:${APP_VERSION}

            if docker manifest inspect $IMAGE > /dev/null 2>&1; then
              echo "✅ ${svc}:${APP_VERSION} já existe no registry, pulando build"
              continue
            fi

            echo "🔨 Building ${svc}:${APP_VERSION}"
            APP_VERSION=$APP_VERSION docker compose build $svc
            # Não fazer docker tag :latest → $IMAGE aqui: o compose build já
            # cria $IMAGE diretamente (image: .../${svc}:${APP_VERSION}).
            # Fazer o tag sobrescreveria a imagem recém-buildada com a antiga
            # (:latest vem do cache_from e tem WORKER_VERSION desatualizado).
          done

      # 6️⃣ Push apenas se imagem existir localmente
      - name: Push das imagens
        working-directory: ed-infra
        run: |
          APP_VERSION=${{ steps.version.outputs.APP_VERSION }}
          for svc in ed-backend-api ed-worker ed-geocoder ed-watchdog ed-frontend-app ed-admin ed-calibrador; do
            IMAGE_VERSION=${REGISTRY}/${svc}:${APP_VERSION}
            IMAGE_LATEST=${REGISTRY}/${svc}:latest

            if docker image inspect $IMAGE_VERSION > /dev/null 2>&1; then
              echo "🚀 Push ${svc}:${APP_VERSION}"
              
              for i in 1 2 3; do
                docker push $IMAGE_VERSION && break
                echo "⚠️ Push falhou, tentativa $i/3..."
                sleep 5
              done

              docker tag $IMAGE_VERSION $IMAGE_LATEST

              for i in 1 2 3; do
                docker push $IMAGE_LATEST && break
                echo "⚠️ Push latest falhou, tentativa $i/3..."
                sleep 5
              done
            else
              echo "ℹ️ ${svc}:${APP_VERSION} não foi buildado, nada para push"
            fi
          done

      # 7️⃣ Push serviços estáveis
      - name: Push serviços estáveis
        run: |
          docker push ${REGISTRY}/ed-postgres:latest || true
          docker push ${REGISTRY}/ed-keycloak:latest || true

      # 8️⃣ Deploy no servidor 
      - name: Deploy completo no servidor
        run: |
          cd /opt/easydoor-stack-stage/ed-infra
          git pull

          echo "⬇️ Atualizando imagens"
          for i in 1 2 3; do
            docker compose pull && break
            echo "⚠️ Pull falhou, tentativa $i/3..."
            sleep 5
          done

          echo "🚀 Subindo stack"
          docker compose up -d --remove-orphans

          echo "♻️ Rebuild aplicação"
          make rebuild
          make up
          make worker-rebuild
          make worker-up


      # 9️⃣ Aplicar migrations
      - name: Aplicar migrations do banco
        run: |
          cd /opt/easydoor-stack-stage/ed-engine
          source /opt/easydoor-stack-stage/ed-infra/.env

          PGPASSWORD="${POSTGRES_PASSWORD}" \
          psql -h localhost -p 5434 -U ${POSTGRES_USER} -d ${POSTGRES_DB} \
            -c "DROP FUNCTION IF EXISTS buscar_comparaveis(numeric, numeric, integer, text);" || true

          PGPASSWORD="${POSTGRES_PASSWORD}" \
          PSQL_CMD="psql -h localhost -p 5434 -U ${POSTGRES_USER} -d ${POSTGRES_DB}" \
          ./migrate.sh migrate

      # 🔟 Cleanup seguro
      - name: Cleanup Docker
        if: always()
        run: |
          docker builder prune -f || true
          docker image prune -f || true
          docker container prune -f || true
