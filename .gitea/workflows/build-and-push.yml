name: Build e Push para Registry

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [service-updated]

jobs:
  build-and-push:
    runs-on: [self-hosted, ubuntu-latest]

    steps:

      # 1. Checkout do ed-infra dentro do workspace
      - name: Checkout ed-infra
        uses: actions/checkout@v4
        with:
          path: ed-infra

      # 2. Calcular versão
      - name: Calcular APP_VERSION
        id: version
        working-directory: ed-infra
        run: echo "APP_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # 3. Clonar repos irmãos
      - name: Clonar repos irmãos
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          BASE_URL="https://deploy:${TOKEN}@git.easydoor.ai/EasyDoor"
          cd $GITHUB_WORKSPACE
          for repo in ed-backend-api ed-worker ed-raspadinha ed-geocoder ed-watchdog ed-frontend-app ed-admin ed-calibrador ed-engine; do
            git clone "${BASE_URL}/${repo}.git" "${repo}" || true
          done

      # 4. Login no registry
      - name: Login no Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.easydoor.ai
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 5. Build das imagens
      - name: Build das imagens
        working-directory: ed-infra
        env:
          REGISTRY: docker.easydoor.ai/easydoor
        run: |
          for svc in ed-backend-api ed-worker ed-geocoder ed-watchdog ed-frontend-app ed-admin ed-calibrador; do
            SVC_VERSION=$(git -C $GITHUB_WORKSPACE/$svc rev-parse --short HEAD)
            
            # Verifica se a tag já existe no registry
            if docker manifest inspect ${REGISTRY}/${svc}:${SVC_VERSION} > /dev/null 2>&1; then
              echo "✅ ${svc}:${SVC_VERSION} já existe no registry, pulando build"
              continue
            fi
            
            echo "🔨 Building ${svc}:${SVC_VERSION}"
            APP_VERSION=$SVC_VERSION docker compose build $svc
          done

      # 6. Push versionados
      - name: Tag e Push — serviços versionados
        working-directory: ed-infra
        env:
          REGISTRY: docker.easydoor.ai/easydoor
        run: |
          for svc in ed-backend-api ed-worker ed-geocoder ed-watchdog ed-frontend-app ed-admin ed-calibrador; do
            SVC_VERSION=$(git -C $GITHUB_WORKSPACE/$svc rev-parse --short HEAD)
            
            if docker manifest inspect ${REGISTRY}/${svc}:${SVC_VERSION} > /dev/null 2>&1; then
              echo "✅ ${svc}:${SVC_VERSION} já existe, atualizando apenas latest..."
              docker pull ${REGISTRY}/${svc}:${SVC_VERSION}
              docker tag ${REGISTRY}/${svc}:${SVC_VERSION} ${REGISTRY}/${svc}:latest
              docker push ${REGISTRY}/${svc}:latest
              continue
            fi
            
            docker tag ${REGISTRY}/${svc}:${SVC_VERSION} ${REGISTRY}/${svc}:latest 2>/dev/null || true
            docker push ${REGISTRY}/${svc}:${SVC_VERSION}
            docker push ${REGISTRY}/${svc}:latest
          done

      # 7. Push serviços estáveis
      - name: Push serviços estáveis
        env:
          REGISTRY: docker.easydoor.ai/easydoor
        run: |
          docker push ${REGISTRY}/ed-postgres:latest
          docker push ${REGISTRY}/ed-keycloak:latest

      # 8. Deploy + Rebuild no servidor
      - name: Deploy completo no servidor
        run: |
          cd /opt/easydoor-stack-stage/ed-infra
          git pull
          
          # Pull individual com retry para cada serviço
          for svc in ed-backend-api ed-worker ed-geocoder ed-watchdog ed-frontend-app ed-admin ed-calibrador keycloak db; do
            for i in 1 2 3; do
              docker compose pull $svc && break
              echo "⚠️ Pull do $svc falhou, tentativa $i/3..."
              sleep 5
            done
          done

          # Garante as imagens via docker pull direto
          for img in ed-backend-api ed-worker ed-geocoder ed-watchdog ed-frontend-app ed-admin ed-calibrador; do
            for i in 1 2 3; do
              docker pull docker.easydoor.ai/easydoor/${img}:latest && break
              echo "⚠️ docker pull ${img} falhou, tentativa $i/3..."
              sleep 5
            done
          done
          
          docker compose up -d --no-build --remove-orphans
          make rebuild up
          make worker-rebuild worker-up
          
          docker compose up -d --no-build --remove-orphans
          make rebuild up
          make worker-rebuild worker-up
          
          docker compose up -d --no-build --remove-orphans
          make rebuild up
          make worker-rebuild worker-up

      # 9. Aplicar migrations do banco (no servidor)
      - name: Aplicar migrations do banco
        run: |
          cd /opt/easydoor-stack-stage/ed-engine
          source /opt/easydoor-stack-stage/ed-infra/.env
          PGPASSWORD="${POSTGRES_PASSWORD}" psql -h localhost -p 5434 -U ${POSTGRES_USER} -d ${POSTGRES_DB} \
            -c "DROP FUNCTION IF EXISTS buscar_comparaveis(numeric, numeric, integer, text);"
          PGPASSWORD="${POSTGRES_PASSWORD}" \
          PSQL_CMD="psql -h localhost -p 5434 -U ${POSTGRES_USER} -d ${POSTGRES_DB}" \
          ./migrate.sh migrate

      # 10. Cleanup Docker
      - name: Cleanup Docker automático
        if: always()
        run: |
          docker builder prune -f || true
          docker image prune -f || true
          docker container prune -f || true
