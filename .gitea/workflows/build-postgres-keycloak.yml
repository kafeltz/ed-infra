name: Build Imagens Estáveis

on:
  push:
    branches: [master]
    paths:
      - 'postgres/**'
      - 'keycloak/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: [self-hosted, ubuntu-latest]

    env:
      REGISTRY: docker.easydoor.ai/easydoor

    steps:
      - name: Checkout ed-infra
        uses: actions/checkout@v4

      - name: Login no Docker Registry
        uses: docker/login-action@v3
        with:
          registry: docker.easydoor.ai
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build e Push ed-postgres
        run: |
          docker build \
            --cache-from ${REGISTRY}/ed-postgres:latest \
            -t ${REGISTRY}/ed-postgres:latest \
            ./postgres
          for i in 1 2 3; do
            docker push ${REGISTRY}/ed-postgres:latest && break
            echo "⚠️ Push falhou, tentativa $i/3..."
            sleep 5
          done

      - name: Build e Push ed-keycloak
        run: |
          docker build \
            --cache-from ${REGISTRY}/ed-keycloak:latest \
            -t ${REGISTRY}/ed-keycloak:latest \
            ./keycloak
          for i in 1 2 3; do
            docker push ${REGISTRY}/ed-keycloak:latest && break
            echo "⚠️ Push falhou, tentativa $i/3..."
            sleep 5
          done

      - name: Cleanup Docker
        if: always()
        run: |
          docker builder prune -f || true
          docker image prune -f || true
